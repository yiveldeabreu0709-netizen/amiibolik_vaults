<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="capture-core.js"></script>
    <style>
      :root {
        --plum: #8a4971;
        --lavender: #ead6ef;
        --lavender-soft: #f7eff9;
        --ink: #2b1a26;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--lavender-soft);
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        font-family: 'Inter', sans-serif;
        background: radial-gradient(circle at 50% 55%, #ffffff 0%, var(--lavender-soft) 45%, var(--lavender) 100%);
      }
      .clip { position: absolute; inset: 0; }

      /* Tarjeta del archivo .bin que se "captura" */
      #binCard {
        position: absolute;
        left: 50%;
        top: 300px;
        width: 460px;
        margin-left: -230px;
        padding: 28px 32px;
        border-radius: 32px;
        background: #ffffff;
        box-shadow: 0 24px 60px -18px rgba(138, 73, 113, 0.45);
        border: 2px solid var(--lavender);
        display: flex;
        align-items: center;
        gap: 22px;
      }
      #binIcon {
        width: 76px;
        height: 76px;
        border-radius: 22px;
        background: var(--plum);
        display: grid;
        place-items: center;
        flex-shrink: 0;
      }
      #binName { font-size: 42px; font-weight: 800; color: var(--ink); letter-spacing: -0.02em; }
      #binMeta { font-size: 28px; font-weight: 600; color: var(--plum); margin-top: 4px; }

      #status {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 150px;
        text-align: center;
      }
      #statusText, #doneText {
        font-size: 44px;
        font-weight: 800;
        letter-spacing: -0.03em;
        color: var(--ink);
      }
      #doneText {
        position: absolute;
        left: 0;
        right: 0;
        top: 0;
        color: var(--plum);
        opacity: 0;
      }
      #bar {
        width: 520px;
        height: 14px;
        margin: 26px auto 0;
        border-radius: 999px;
        background: rgba(138, 73, 113, 0.18);
        overflow: hidden;
      }
      #barFill {
        width: 100%;
        height: 100%;
        background: var(--plum);
        border-radius: 999px;
        transform-origin: 0 50%;
      }
    </style>
  </head>
  <body>
    <div data-hf-id="hf-q3jf"
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="7.4"
      data-width="1920"
      data-height="1080"
    >
      <section data-hf-id="hf-l5yz" id="scene" class="clip" data-start="0" data-duration="7.4" data-track-index="0" data-layout-allow-overlap>
        <div data-hf-id="hf-93t2" id="binCard">
          <div data-hf-id="hf-o0kn" id="binIcon">
            <svg data-hf-id="hf-ud2g" width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path data-hf-id="hf-z9ox" d="M6 8.3a6 6 0 0 1 0 7.4" /><path data-hf-id="hf-ewk6" d="M9.5 6a10 10 0 0 1 0 12" /><path data-hf-id="hf-vh3m" d="M13 3.7a14 14 0 0 1 0 16.6" /><circle data-hf-id="hf-7q3f" cx="3.5" cy="12" r="1" fill="#ffffff" />
            </svg>
          </div>
          <div data-hf-id="hf-yeow">
            <div data-hf-id="hf-whme" id="binName">Link.bin</div>
            <div data-hf-id="hf-yhne" id="binMeta">NTAG215 · 540 bytes</div>
          </div>
        </div>

        <div data-hf-id="hf-ut67" id="stage" style="position:absolute;inset:0"></div>

        <div data-hf-id="hf-odm3" id="status">
          <div data-hf-id="hf-uptf" id="statusText">Transfiriendo a tu AmiiboLink…</div>
          <div data-hf-id="hf-qxku" id="doneText">¡Amiibo transferido!</div>
          <div data-hf-id="hf-2to0" id="bar"><div data-hf-id="hf-puaz" id="barFill"></div></div>
        </div>
      </section>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      const refs = AmiiboCapture.mount(document.getElementById("stage"), { size: 340, top: "54%", visible: true });
      const card = document.getElementById("binCard");

      // Entrada de la tarjeta y del texto
      tl.from("#bar", { autoAlpha: 0, duration: 0.3 }, 0.15);
      tl.set("#barFill", { scaleX: 0 }, 0);

      // Lanzamiento + absorción
      tl.add(AmiiboCapture.enter(refs, card), 0.45);

      // Los 3 meneos mientras se llena la barra
      tl.to("#barFill", { scaleX: 1, duration: 3.5, ease: "none" }, 1.6);
      tl.add(AmiiboCapture.wobble(refs, 0), 1.7);
      tl.add(AmiiboCapture.wobble(refs, 1), 2.86);
      tl.add(AmiiboCapture.wobble(refs, 2), 4.02);

      // ¡Atrapado!
      tl.add(AmiiboCapture.success(refs), 5.18);
      tl.to("#statusText", { autoAlpha: 0, y: -16, duration: 0.2 }, 5.0);
      tl.fromTo("#doneText", { autoAlpha: 0, scale: 0.7 }, { autoAlpha: 1, scale: 1, duration: 0.45, ease: "back.out(2)" }, 5.25);
      tl.to("#bar", { autoAlpha: 0, duration: 0.3 }, 5.3);

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
