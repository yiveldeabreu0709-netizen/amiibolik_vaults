      const tl = gsap.timeline({ paused: true });
      const STEP = 0.65, T0 = 0.7;
      tl.fromTo("#s2-title", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.1);
      tl.fromTo("#s2-card", { scale: 0.86, opacity: 0, transformOrigin: "50% 50%" }, { scale: 1, opacity: 1, duration: 0.55, ease: "power3.out" }, 0.15);
      tl.fromTo("#s2-dots", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 0.4);
      const dots = document.querySelectorAll("#root .s2-dot");
      for (let i = 0; i < 8; i++) {
        const b = "#s2-b" + i, t = T0 + i * STEP;
        // Cada banner entra con un barrido distinto, sobre el anterior
        const wipes = [
          ["inset(0 100% 0 0)", "inset(0 0% 0 0)"],
          ["inset(100% 0 0 0)", "inset(0% 0 0 0)"],
          ["inset(0 0 0 100%)", "inset(0 0 0 0%)"],
          ["circle(0px at 50% 50%)", "circle(1200px at 50% 50%)"]
        ][i % 4];
        if (i === 0) {
          tl.fromTo(b, { scale: 1.12, transformOrigin: "50% 50%" }, { scale: 1, duration: 1.0, ease: "power2.out" }, 0.3);
        } else {
          tl.set(b, { zIndex: i }, 0);
          tl.fromTo(b, { clipPath: wipes[0] }, { clipPath: wipes[1], duration: 0.3, ease: "power3.inOut" }, t - 0.05);
          tl.fromTo(b + " .s2-cover, " + b + " .s2-fg", { scale: 1.14 }, { scale: 1, duration: 0.75, ease: "power2.out", transformOrigin: "50% 50%" }, t - 0.05);
        }
        if (i > 1) tl.set("#s2-b" + (i - 2), { autoAlpha: 0 }, t + 0.3);
        tl.fromTo(b + " .s2-name", { x: -40, opacity: 0 }, { x: 0, opacity: 1, duration: 0.3, ease: "back.out(1.6)" }, t + 0.12);
        tl.to(dots[i], { backgroundColor: "#7BDF96", scale: 1.35, duration: 0.15 }, t);
        if (i > 0) tl.to(dots[i - 1], { backgroundColor: "rgba(255,255,255,0.7)", scale: 1, duration: 0.15 }, t);

      window.__timelines["s2-franquicias"] = tl;
