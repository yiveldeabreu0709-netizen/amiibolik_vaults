  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      const HOT = { x: 42, y: 6 };                    // punta del dedo dentro del cursor (96x123)
      const curAt = (p) => ({ x: p.x - HOT.x, y: p.y - HOT.y });
      // Cámara: punch-in sobre la tarjeta 1 (origen en su centro)
      const ORG = { x: 580, y: 600 }, SC = 1.45, SHIFT = { x: 380, y: 20 };
      const camPt = (p) => ({ x: ORG.x + (p.x - ORG.x) * SC + SHIFT.x, y: ORG.y + (p.y - ORG.y) * SC + SHIFT.y });

      // Entrada: barrido horizontal con desenfoque
      tl.fromTo("#s3-wrap", { x: 1920, filter: "blur(18px)" }, { x: 0, filter: "blur(0px)", duration: 0.45, ease: "power3.out" }, 0);

      // Las tarjetas aparecen una a una
      for (let i = 0; i < 4; i++) {
        tl.fromTo("#s3-c" + i, { y: 50, scale: 0.86, opacity: 0, transformOrigin: "50% 50%" },
          { y: 0, scale: 1, opacity: 1, duration: 0.5, ease: "back.out(1.5)" }, 0.7 + i * 0.22);
      }
      tl.fromTo("#s3-h1, #s3-chip, #s3-crumb", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.45, ease: "power3.out", stagger: 0.08 }, 0.5);

      // Cursor entra desde abajo a la derecha hasta la tarjeta 1
      const p0 = curAt({ x: 1500, y: 1040 }), p1 = curAt({ x: 640, y: 640 });
      tl.set("#s3-cur", { x: p0.x, y: p0.y }, 0);
      tl.to("#s3-cur", { x: p1.x, y: p1.y, duration: 1.0, ease: "power2.inOut" }, 1.7);
      // Hover de la tarjeta
      tl.to("#s3-c0", { y: -16, duration: 0.25, ease: "power2.out" }, 2.55);
      tl.to("#s3-f0", { scale: 1.06, duration: 0.3, ease: "power2.out", transformOrigin: "50% 60%" }, 2.55);
      // Clic en la tarjeta
      const click = (t, at) => {
        tl.set("#s3-cur1", { opacity: 0 }, t);
        tl.set("#s3-cur2", { opacity: 1 }, t);
        tl.to("#s3-cur", { scale: 0.88, duration: 0.07, transformOrigin: HOT.x + "px " + HOT.y + "px" }, t);
        tl.to("#s3-cur", { scale: 1, duration: 0.12 }, t + 0.07);
        tl.set("#s3-cur1", { opacity: 1 }, t + 0.16);
        tl.set("#s3-cur2", { opacity: 0 }, t + 0.16);
        tl.fromTo("#s3-crip", { x: at.x, y: at.y, scale: 0.3, opacity: 0.9 }, { immediateRender: false, scale: 1.6, opacity: 0, duration: 0.4, ease: "power2.out" }, t);
      };
      click(2.75, { x: 640, y: 640 });
      tl.to("#s3-c0", { scale: 1.04, duration: 0.12, transformOrigin: "50% 50%", yoyo: true, repeat: 1 }, 2.75);

      // Punch-in de cámara hacia la tarjeta
      tl.to("#s3-h1, #s3-chip, #s3-crumb", { opacity: 0, duration: 0.3, ease: "power1.in" }, 3.15);
      tl.to("#s3-cam", { scale: SC, x: SHIFT.x, y: SHIFT.y, transformOrigin: ORG.x + "px " + ORG.y + "px", duration: 0.65, ease: "power2.inOut" }, 3.15);
      // El cursor viaja al corazón
      const heart = camPt({ x: 420 + 320 - 20 - 32, y: 340 + 20 + 32 });
      const ph = curAt(heart);
      tl.to("#s3-cur", { x: ph.x, y: ph.y, duration: 0.7, ease: "power2.inOut" }, 3.35);
      click(4.15, heart);
      // Corazón se llena y ráfaga
      tl.to("#s3-hbg", { opacity: 1, duration: 0.12 }, 4.2);
      tl.to("#s3-hpath", { fill: "#FFFFFF", duration: 0.12 }, 4.2);
      tl.fromTo("#s3-h0", { scale: 1 }, { scale: 1.25, duration: 0.18, ease: "power2.out", yoyo: true, repeat: 1 }, 4.2);
      tl.set("#s3-fx", { x: heart.x, y: heart.y }, 4.2);
      tl.set("#s3-fring, #root .s3-fxs, #s3-crip", { opacity: 0 }, 0);
      tl.fromTo("#s3-fring", { scale: 0.3, opacity: 0.95 }, { immediateRender: false, scale: 2.2, opacity: 0, duration: 0.5, ease: "power2.out" }, 4.2);
      const dirs = [-90, -40, -140, -65, -115, 0, 180];
      document.querySelectorAll("#root .s3-fxs").forEach((el, i) => {
        const a = dirs[i] * Math.PI / 180, d = 100 + (i % 3) * 30;
        tl.fromTo(el, { x: 0, y: 0, scale: 0.2, rotation: 0, opacity: 1 },
          { immediateRender: false, x: Math.cos(a) * d, y: Math.sin(a) * d - 20, scale: 1.1, rotation: i % 2 ? 90 : -90, duration: 0.5, ease: "power2.out" }, 4.2 + i * 0.02);
        tl.to(el, { y: Math.sin(a) * d - 20 + 40, scale: 0, opacity: 0, duration: 0.35, ease: "power1.in" }, 4.72 + i * 0.02);
      });
      // Cursor se retira un poco
      tl.to("#s3-cur", { x: ph.x + 120, y: ph.y + 90, opacity: 0, duration: 0.5, ease: "power2.in" }, 5.2);
      window.__timelines["s3-dashboard"] = tl;
    })();
  </script>
